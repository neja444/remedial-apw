<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Remedial Prep</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#07130d; --bar:#0c1d14; --card:#10231a; --card2:#16301f; --line:#1f3a2b;
  --text:#eaf5ee; --hint:#8fb09d; --accent:#1fbf6b; --accent-d:#0b7a43;
  --gold:#e0a526; --gold-bg:#3a2d0c; --bad:#e5534b; --good:#1fbf6b;
}
:root[data-theme="light"]{
  --bg:#f3f8f5; --bar:#ffffff; --card:#ffffff; --card2:#e4f2ea; --line:#d3e5db;
  --text:#10231a; --hint:#5d7a6a; --gold-bg:#fbefcf;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Ethiopic",sans-serif;padding-bottom:84px}
.top{position:sticky;top:0;z-index:5;background:var(--bar);border-bottom:1px solid var(--line);padding:12px 14px;display:flex;gap:10px;align-items:center}
.ico{width:44px;height:44px;border-radius:12px;background:var(--card2);display:grid;place-items:center;font-size:20px;flex:none;border:1px solid var(--line)}
.top .sel{flex:1;min-width:0}
.top small{display:block;letter-spacing:.12em;font-size:11px;color:var(--hint);font-weight:700}
select{width:100%;background:transparent;color:var(--text);border:0;font-size:17px;font-weight:700;padding:2px 0;outline:none;appearance:none}
select option{color:#000}
main{padding:16px 14px}
h2{margin:0 0 4px;font-size:22px} .sub{color:var(--hint);font-size:14px;margin:0 0 14px}
.hero{background:linear-gradient(135deg,var(--accent-d),#0e4d2c);color:#fff;border-radius:20px;padding:18px;margin-bottom:20px}
.hero h3{margin:0 0 4px;font-size:20px}.hero p{margin:0 0 12px;opacity:.85;font-size:14px}
.bar{height:8px;background:rgba(255,255,255,.2);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:#fff;border-radius:99px}
.btn{display:inline-block;border:0;border-radius:99px;padding:10px 18px;font-weight:700;font-size:15px;background:#fff;color:#0b7a43;margin-top:12px}
.btn.full{display:block;width:100%;border-radius:12px;background:var(--accent);color:#fff;padding:13px}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:6px}
.tile .row{display:flex;justify-content:space-between;align-items:center}
.tile .ico{width:40px;height:40px;font-size:18px}
.chip{font-size:11px;font-weight:800;letter-spacing:.08em;padding:5px 10px;border-radius:99px;background:var(--card2);color:var(--accent)}
.tile.gold .chip{background:var(--gold-bg);color:var(--gold)} .tile.gold .ico{background:var(--gold-bg)}
.tile b{font-size:17px}.tile span{color:var(--hint);font-size:13px}
.tile .open{color:var(--accent);font-weight:700;margin-top:6px}.tile.gold .open{color:var(--gold)}
.label{font-size:13px;font-weight:800;letter-spacing:.12em;color:var(--hint);margin:22px 0 10px}
.link{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;font-weight:700;text-align:center}
.list .item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.item small{color:var(--hint);display:block;margin-top:2px}
.q{font-size:18px;font-weight:700;line-height:1.4;margin:10px 0 14px}
.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--text);border:1.5px solid var(--line);border-radius:12px;padding:13px;margin-bottom:10px;font-size:16px}
.opt.good{border-color:var(--good);background:rgba(31,191,107,.15)}.opt.bad{border-color:var(--bad);background:rgba(229,83,75,.15)}
.expl{background:var(--card2);border-radius:12px;padding:12px;font-size:14px;margin:6px 0 12px}
.meta{display:flex;justify-content:space-between;color:var(--hint);font-size:14px;font-weight:600}
.big{font-size:56px;font-weight:800;text-align:center;margin:10px 0;color:var(--accent)}
.note{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.note summary{padding:14px;font-weight:700;list-style:none}
.note div{padding:0 14px 14px;color:var(--text);font-size:15px;line-height:1.55;white-space:pre-line}
.rank{display:flex;gap:10px;align-items:center}.rank .n{width:28px;height:28px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-weight:800;font-size:13px}
.avatar{width:84px;height:84px;border-radius:50%;background:var(--card2);margin:0 auto 10px;display:grid;place-items:center;font-size:36px;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.stats b{display:block;font-size:22px;color:var(--accent)}.stats span{font-size:12px;color:var(--hint)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--bar);border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:6}
nav button{flex:1;background:none;border:0;color:var(--hint);font-size:11px;font-weight:700;padding:6px 0;border-radius:14px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button i{font-style:normal;font-size:20px}nav button.on{color:var(--accent);background:var(--card2)}
.banner{display:flex;gap:12px;align-items:center;background:var(--gold-bg);color:var(--gold);border:1px solid var(--gold);border-radius:16px;padding:14px;margin-bottom:18px;font-weight:700}
.banner small{display:block;font-weight:500;opacity:.85}
.lock{opacity:.6}
.pay{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;line-height:1.6;font-size:15px}
.pay b{color:var(--accent)}
input[type=text]{width:100%;background:var(--bg);color:var(--text);border:1.5px solid var(--line);border-radius:12px;padding:13px;font-size:16px;margin-top:6px;outline:none;text-transform:uppercase}
.msg{margin:10px 0;font-size:14px;color:var(--hint);text-align:center}
.tile.wide{grid-column:1/-1}
.vip{display:inline-block;background:var(--gold-bg);color:var(--gold);border-radius:99px;padding:4px 12px;font-size:12px;font-weight:800;letter-spacing:.08em;margin-bottom:8px}
.form label{display:block;font-size:13px;font-weight:700;color:var(--hint);margin:14px 0 6px}
.form input,.form select{display:block;width:100%;background:var(--card);color:var(--text);border:1.5px solid var(--line);border-radius:12px;padding:13px;font-size:16px;font-weight:500;outline:none;text-transform:none;margin:0;-webkit-appearance:auto;appearance:auto}
.form input:focus,.form select:focus{border-color:var(--accent)}
</style>
</head>

/* =====================  4. QUIZ ENGINE  ===================== */
function startQuiz(title, pool, count, seconds, kind, ordered){
  const qs = (ordered ? pool : shuffle(pool)).slice(0, count).map(q => {
    // shuffle options but remember the right one (past exams keep their original order)
    const idx = ordered ? q.o.map((t,i)=>i) : shuffle(q.o.map((t,i)=>i));
    return { q:q.q, e:q.e, o: idx.map(i=>q.o[i]), a: idx.indexOf(q.a) };
  });
  clearInterval(timer);
  quiz = { title, qs, i:0, score:0, picked:null, kind, end: seconds ? Date.now()+seconds*1000 : 0 };
  view = "quiz"; render();
  if(seconds) timer = setInterval(tick, 500);
}
function tick(){
  const left = Math.max(0, Math.round((quiz.end - Date.now())/1000));
  const el = $("#clock"); if(el) el.textContent = `${Math.floor(left/60)}:${String(left%60).padStart(2,"0")}`;
  if(left <= 0) finish();
}
function quizView(){
  const q = quiz.qs[quiz.i];
  return `<div class="meta"><span>${esc(quiz.title)}</span><span>${quiz.i+1}/${quiz.qs.length}${quiz.end?` · ⏱ <span id="clock"></span>`:""}</span></div>
  <div class="bar" style="background:var(--line);margin-top:10px"><i style="background:var(--accent);width:${100*quiz.i/quiz.qs.length}%"></i></div>
  <div class="q">${esc(q.q)}</div>
  ${q.o.map((t,i)=>{
    let c=""; if(quiz.picked!==null){ if(i===q.a) c="good"; else if(i===quiz.picked) c="bad"; }
    return `<button class="opt ${c}" data-act="pick" data-i="${i}" ${quiz.picked!==null?"disabled":""}>${"ABCD"[i]}. ${esc(t)}</button>`;
  }).join("")}
  ${quiz.picked!==null ? `<div class="expl">💡 ${esc(q.e||"")}</div>
    <button class="btn full" data-act="next">${quiz.i+1===quiz.qs.length?"Finish":"Next"} →</button>` : ""}`;
}
function pick(i){
  if(quiz.picked!==null) return;
  const q = quiz.qs[quiz.i]; quiz.picked = i;
  const ok = i===q.a; if(ok) quiz.score++;
  S.answered++; if(ok) S.correct++;
  const b = S.bySubject[S.subject] = S.bySubject[S.subject] || {a:0,c:0}; b.a++; if(ok) b.c++;
  save(); haptic(ok?"success":"error"); render();
}
function next(){ quiz.i++; quiz.picked=null; quiz.i>=quiz.qs.length ? finish() : render(); }
function finish(){
  clearInterval(timer);
  S.quizzes++;
  if(quiz.kind==="daily"){
    const name = user?.first_name || "You";
    S.board.push({name, subject:subj().name, score:quiz.score, total:quiz.qs.length, date:new Date().toLocaleDateString()});
    S.board = S.board.slice(-50); submitScore(quiz.score, quiz.qs.length);
  }
  save(); view="result"; render();
}
function result(){
  const p = Math.round(100*quiz.score/quiz.qs.length);
  return `<h2 style="text-align:center">${p>=70?"🎉 Great job!":p>=40?"👍 Keep going!":"💪 Don't give up!"}</h2>
  <div class="big">${quiz.score}/${quiz.qs.length}</div><p class="sub" style="text-align:center">${p}% correct</p>
  <button class="btn full" data-act="again">Try again</button>
  <button class="btn full ghost" style="margin-top:10px" data-go="${quiz.kind==="exam"?"exams":"questions"}">Back</button>`;
}

  if(!API_URL) return;
  try{ await api("/api/score",{score,total,subject:S.subject}); }catch(e){}

async function api(path, body){

  const r = await fetch(API_URL+path,{
    method: body ? "POST" : "GET",
    headers:{"Content-Type":"application/json","X-Telegram-Init-Data":tg?.initData||""},
    body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error||"error");
  return j;
}

function render(){
  if(!S.registered) view = "register";   // everyone registers first
  const v = {home,questions,faq,compete,profile,quiz:quizView,result,premium:premiumView,register:registerView,exams:examsView,book:bookView}[view] || home;
  $("#view").innerHTML = v();
  const tab = ["quiz","result","exams","book"].includes(view) ? "questions" : view==="premium" ? "home" : view==="register" ? "profile" : view;
  $("#nav").innerHTML = !S.registered ? "" : NAV.map(([id,ic,l])=>`<button class="${id===tab?"on":""}" data-go="${id}"><i>${ic}</i>${l}</button>`).join("");
  if(view==="quiz" && quiz.end) tick();
  window.scrollTo(0,0);
}
let lastQuiz = null;
document.addEventListener("click", e=>{
  const el = e.target.closest("[data-go],[data-act],[data-link]"); if(!el) return;
  if(el.dataset.link){ const u = el.dataset.link; (tg?.openTelegramLink && u.startsWith("https://t.me")) ? tg.openTelegramLink(u) : window.open(u,"_blank"); return; }
  if(el.dataset.go){ clearInterval(timer); view = el.dataset.go; return render(); }
  const a = el.dataset.act;
  if(a==="pick") pick(+el.dataset.i);
  else if(a==="next") next();
  else if(a==="topic"){ const idx = subj().topics.findIndex(x=>x.id===el.dataset.id); if(idx>0 && !gate()) return; const t = subj().topics[idx]; lastQuiz=()=>startQuiz(t.name,t.questions,t.questions.length,0,"topic"); lastQuiz(); }
  else if(a==="mock"){ if(!gate()) return; lastQuiz=()=>startQuiz("Mock Exam",allQs(),10,15*60,"mock"); lastQuiz(); }
  else if(a==="daily"){ if(!gate()) return; lastQuiz=()=>startQuiz("Daily Challenge",allQs(),5,5*60,"daily"); lastQuiz(); }
  else if(a==="exam"){
    const i = +el.dataset.i; if(i>0 && !gate()) return;
    const x = (EXAMS[S.subject]||[])[i]; if(!x) return;
    lastQuiz=()=>startQuiz(x.title,x.questions,x.questions.length,(x.minutes||0)*60,"exam",true); lastQuiz();
  }
  else if(a==="book"){
    const i = +el.dataset.i; if(i>0 && !gate()) return;
    const b = (BOOKS[S.subject]||[])[i]; if(!b) return;
    const u = new URL(b.file, location.href).href;
    tg?.openLink ? tg.openLink(u) : window.open(u,"_blank");
  }
  else if(a==="register") submitRegistration();
  else if(a==="pay") submitPayment();
  else if(a==="check") refreshMe().then(()=>say(S.premium ? "" : "Still waiting for approval."));
  else if(a==="again") lastQuiz && lastQuiz();
  else if(a==="reset"){ if(confirm("Reset all progress?")){ Object.assign(S,{answered:0,correct:0,quizzes:0,bySubject:{},board:[]}); save(); render(); } }
});

  social:  ["math","econ","geo","hist","eng"]
};
function fillSubjects(){
  const keys = STREAM_SUBJECTS[S.profile?.stream] || Object.keys(DATA);
  if(!keys.includes(S.subject)) S.subject = keys[0];
  sel.innerHTML = keys.map(k=>`<option value="${k}">${DATA[k].icon} ${DATA[k].name} · ${DATA[k].am}</option>`).join("");
  sel.value = S.subject;
}
fillSubjects();
sel.onchange = () => { S.subject = sel.value; save(); view="home"; render(); };
function applyTheme(){ document.documentElement.dataset.theme = S.theme; $("#theme").textContent = S.theme==="dark"?"☀️":"🌙"; }
$("#theme").onclick = () => { S.theme = S.theme==="dark"?"light":"dark"; save(); applyTheme(); };
applyTheme(); render(); refreshMe();
</script>
</body>
</html>
